name: Website

# Deploys site/ to Azure Static Web Apps, by hand only: Actions → Website → Run workflow.
# Runs only in adirh3/lumi-site when adirh3 starts it from main, and waits for approval in the
# "website" environment, which holds the deployment token. See DEPLOY.md.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'production = the live site; preview = a separate preview address'
        type: choice
        options: [production, preview]
        default: production

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'adirh3/lumi-site' && github.ref == 'refs/heads/main' && github.triggering_actor == 'adirh3'
    runs-on: ubuntu-latest
    environment:
      name: website
      url: ${{ steps.production.outputs.static_web_app_url || steps.preview.outputs.static_web_app_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the site URL
        if: inputs.target == 'production'
        run: |
          if grep -q 'lumi-site.example' site/index.html; then
            echo "::error file=site/index.html::Set the site URL before deploying to production (DEPLOY.md, step 1)."
            exit 1
          fi

      - name: Deploy to production
        id: production
        if: inputs.target == 'production'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          output_location: ''
          skip_app_build: true

      # deployment_environment isn't listed in the action's metadata, so the log warns about an
      # unexpected input, but Azure deploys to the named preview environment.
      - name: Deploy to preview
        id: preview
        if: inputs.target == 'preview'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          output_location: ''
          skip_app_build: true
          deployment_environment: preview
